[project]
name = "studyfinder"
version = "0.1.0"
description = "Backend de StudyFinder (FastAPI + MongoDB)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Cotas mínimas = versiones con las que pasa la suite de tests.
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "pymongo>=4.19.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mongomock>=4.3.0",
]

[tool.uv]
# El código aún vive en app/ (sin empaquetar); se activará el empaquetado
# al pasar al layout src/ de la reestructuración.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
